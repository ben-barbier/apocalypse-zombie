<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Apocalypse Zombie</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* The haze, so the page never flashes white before the scene is up.
           The one code lives in the spec — 07, "La lumière et la brume" — and
           render/scene.ts reads it from there too. */
        background: #d9955c;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
