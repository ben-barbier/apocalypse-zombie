<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Apocalypse Zombie</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* The haze, so the page never flashes white before the scene is up.
           The one code lives in the spec — 07, "La lumière et la brume" — and
           render/scene.ts reads it from there too. */
        background: #d9955c;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* ================================================================
         The hud: five things over the world and nothing else — the bar of
         the town hall, the five pips, the purse and its four badges, the
         street arrows, the phase strip. The list is closed, and a sixth
         goes through chapter 8 and never through a reflex.
         (spec 08-1, 08-2, 08-3)

         It is DOM and CSS over the canvas and is never drawn in WebGL, so
         it costs no draw call at all on the 80 of the budget, its figures
         stay crisp at setPixelRatio 1, and the browser hands it both
         env(safe-area-inset-*) and the re-laying out. (spec 08-11)

         Everything that can be settled once is settled here, in the sheet:
         the two dispositions, every size, and every colour. What
         render/hud.ts writes at run time is a handful of class names, a
         handful of figures, and three custom properties — never a colour,
         and never once a frame. (spec 08-12)

         The one image of the game is the atlas of chapter 7, so nothing
         here loads a second one: the pictos are blocky inline shapes on a
         16 by 16 grid, the very grid a tile is drawn on.
         ================================================================ */
      /* --- the colours. Every one of them is chapter 7's, and there is
         not a red among them: the palette holds none, and the bar of the
         town hall is brown. (spec 07-11, 08-14, 08-19)

         They sit on the page rather than on #hud because the fade that
         closes a game wears two of them, and it is not part of the hud:
         the hud erases, the fade stays. (spec 08-63) --- */
      :root {
        --ground: #14110e; /* derived: the hud's own warm near-black ground */
        --lost: #2a231c; /* derived: a segment gone, "almost black" (spec 08-18) */
        --hall: #b17c52; /* spec 07 "Mur": the one brown of the bar (spec 08-14) */
        --pip: #1f6fd8; /* spec 07 "Tunique du joueur" (spec 08-20) */
        --hollow: #123c73; /* derived: the same blue sunk, for a pip that is gone */
        --white: #ffffff; /* spec 07-12: what just happened */
        --coin: #ffd24a; /* spec 07: the one gold, and what a badge lights in */
        --dim: #5c5449; /* derived: a badge one cannot pay for */
        --stone: #e8cba0; /* spec 07 "Pierre de la mairie": the ink of the hud */
        --wood: #6e4526; /* spec 07 "Bois de la base" */
        --street1: #5fd8f2; /* spec 07: the three gateways, and render/city.ts */
        --street2: #f25fd8;
        --street3: #e8f25f;
      }

      #hud {
        position: fixed;
        inset: 0;
        /* The hud is looked at and never touched: the targets of chapter 8
           are their own thing, and nothing here ever eats a press. */
        pointer-events: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        -webkit-user-select: none;
        user-select: none;

        /* --- the sizes, every one a share of the smaller side of the
           window and bounded in pixels. (spec 08-10, spec 08 "Les tailles") --- */
        --big: clamp(48px, 12vmin, 96px); /* the figure of what is left */
        --arrow: clamp(32px, 8vmin, 64px);
        --badge: clamp(28px, 6vmin, 56px);
        --pip-side: clamp(14px, 3.5vmin, 28px);
        --bar: clamp(200px, 40vw, 420px); /* 40 % of the width */

        /* An display keeps clear of a border by the safe area and 16 px.
           (spec 08-50, spec 08 "Les cibles tactiles") */
        --edge: 16px;
        --gap: calc(var(--pip-side) * 0.45);

        /* --- the three properties render/hud.ts writes, and the only ones,
           each a whole percent so a hundredth of a screen is the smallest
           thing that ever asks for a write. (spec 08-12) --- */
        --drain: 100; /* how much of a preparation is left */
        --gauge: 0; /* how far down its street a column has come */
        --at: 50; /* where across the screen an arrow rides */
      }

      /* ---------------------------------------------------------------
         The two dispositions, and the ratio of the window settles which:
         narrow is what this sheet writes plainly, wide is the one media
         query below. The orientation of the device enters nowhere — it
         locks on no iPad, and Split View hands over any proportion at all.
         A window that changes size re-lays out on the spot and holds
         nothing up. (spec 08-8, 08-9)
         --------------------------------------------------------------- */
      #strip {
        position: absolute;
        top: calc(env(safe-area-inset-top) + var(--edge));
        left: calc(env(safe-area-inset-left) + var(--edge));
        right: calc(env(safe-area-inset-right) + var(--edge));
        display: grid;
        grid-template-columns: 1fr;
        row-gap: var(--gap);
      }
      #hall {
        justify-self: start;
      }
      #phase {
        justify-self: center;
      }
      #mine {
        justify-self: end;
      }
      @media (min-aspect-ratio: 1/1) {
        #strip {
          grid-template-columns: 1fr auto 1fr;
          align-items: start;
        }
      }

      /* ---------------------------------------------------------------
         1 — The bar of the town hall, top left, because left is the city.
         Ten segments whatever the notch of reinforcement, brown from the
         first second to the last, and a picto at its left end whose stuff
         says the notch — never a figure. (spec 08-6, 08-13, 08-14, 08-15)
         --------------------------------------------------------------- */
      #hall {
        display: flex;
        align-items: center;
        gap: var(--gap);
      }
      #notch {
        width: calc(var(--pip-side) * 1.6);
        height: calc(var(--pip-side) * 1.6);
        flex: none;
      }
      #notch svg {
        display: none;
        width: 100%;
        height: 100%;
      }
      #notch.n0 svg:nth-child(1),
      #notch.n1 svg:nth-child(2),
      #notch.n2 svg:nth-child(3),
      #notch.n3 svg:nth-child(4) {
        display: block;
      }
      #bar {
        position: relative;
        width: var(--bar);
        height: var(--pip-side);
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 2px;
        background: var(--ground);
        padding: 2px;
        box-sizing: border-box;
      }
      .seg {
        background: var(--hall);
      }
      /* A segment gone is almost black, and only a reinforcement brings it
         back. (spec 08-18) */
      .seg.gone {
        background: var(--lost);
      }
      /* A blow taken: the segment being eaten lights white for 80 ms. The
         two names are the same flash: writing the other one is what starts
         it again on a segment struck twice. (spec 08-16, 07 "Les signaux blancs") */
      .seg.a {
        animation: struck 80ms;
      }
      .seg.b {
        animation: struck 80ms;
      }
      @keyframes struck {
        from,
        to {
          background: var(--white);
        }
      }
      /* A reinforcement bought: white fills the bar from left to right in
         400 ms, then leaves the same way. (spec 08-17) */
      #bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--white);
        clip-path: inset(0 100% 0 0);
      }
      #bar.a::after,
      #bar.b::after {
        animation: reinforced 400ms;
      }
      @keyframes reinforced {
        from {
          clip-path: inset(0 100% 0 0);
        }
        50% {
          clip-path: inset(0 0 0 0);
        }
        to {
          clip-path: inset(0 0 0 100%);
        }
      }

      /* ---------------------------------------------------------------
         2 — The five pips, top right, because right is you. Discrete
         squares that come back, against a continuous bar that crumbles:
         the shape, the colour and the corner say on their own which of the
         two gauges ends a game. (spec 08-6, 08-20, 08-21, 08-22)
         --------------------------------------------------------------- */
      #mine {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: var(--gap);
      }
      #pips {
        display: flex;
        gap: calc(var(--gap) * 0.7);
      }
      .pip {
        width: var(--pip-side);
        height: var(--pip-side);
        background: var(--pip);
      }
      .pip.gone {
        background: var(--ground);
        box-shadow: inset 0 0 0 2px var(--hollow);
      }
      .pip.back {
        animation: back 400ms;
      }
      @keyframes back {
        from,
        to {
          background: var(--white);
        }
      }

      /* ---------------------------------------------------------------
         3 — The purse: the figure of the coins, and under it four badges
         in one fixed order — cannon, flame, conveyor, reinforcement — each
         carrying its price in figures, lit when it can be paid for and out
         when it cannot. The armful has no badge of its own.
         (spec 08-23, 08-24, 08-25, 08-27)
         --------------------------------------------------------------- */
      #purse {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: calc(var(--gap) * 0.7);
      }
      #coins {
        color: var(--coin);
        font-size: calc(var(--badge) * 0.62);
      }
      #badges {
        display: flex;
        gap: calc(var(--gap) * 0.7);
      }
      .badge {
        width: var(--badge);
        height: calc(var(--badge) * 1.34);
        background: var(--ground);
        color: var(--dim);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: calc(var(--badge) * 0.08) 0;
        box-sizing: border-box;
        font-size: calc(var(--badge) * 0.4);
      }
      .badge svg {
        width: calc(var(--badge) * 0.66);
        height: calc(var(--badge) * 0.66);
        fill: currentColor;
      }
      /* Lit is the gold of a coin, and it comes in on a white flash of
         400 ms. (spec 08-25) */
      .badge.lit {
        color: var(--coin);
        animation: lit 400ms;
      }
      @keyframes lit {
        from,
        to {
          color: var(--white);
        }
      }

      /* ---------------------------------------------------------------
         4 — The street arrows: one per active street, always there, in the
         colour of its gateway, with a gauge that fills as the head of the
         column comes down. They are the one view of what is off screen —
         this game has no map of any kind — and they live in the top two
         thirds and never lower. (spec 08-31 to 08-35, 08-41)
         --------------------------------------------------------------- */
      #arrows {
        position: absolute;
        top: 0;
        height: 66.6%;
        left: calc(env(safe-area-inset-left) + var(--edge) + var(--arrow) / 2);
        right: calc(env(safe-area-inset-right) + var(--edge) + var(--arrow) / 2);
      }
      .arrow {
        position: absolute;
        bottom: 0;
        left: calc(var(--at) * 1%);
        transform: translateX(-50%);
        width: var(--arrow);
        height: var(--arrow);
        display: none;
        background: var(--hue);
        clip-path: polygon(50% 100%, 0 0, 100% 0);
      }
      .arrow.on {
        display: block;
      }
      .arrow::after {
        content: '';
        position: absolute;
        inset: 3px 4px 4px 4px;
        clip-path: polygon(50% 100%, 0 0, 100% 0);
        background: linear-gradient(
          to top,
          var(--hue) calc(var(--gauge) * 1%),
          var(--ground) calc(var(--gauge) * 1%)
        );
      }
      #arrows .arrow:nth-child(1) {
        --hue: var(--street1);
      }
      #arrows .arrow:nth-child(2) {
        --hue: var(--street2);
      }
      #arrows .arrow:nth-child(3) {
        --hue: var(--street3);
      }

      /* ---------------------------------------------------------------
         5 — The phase strip, top centre: the number of the wave, small,
         above — and never a total, neither out of ten nor a ceiling in
         overtime. Under it one reserved height that never carries two
         things at once: a bar that runs out in a preparation, the large
         figure of what is left in an assault.
         (spec 08-37, 08-38, 08-39, 08-40)
         --------------------------------------------------------------- */
      #phase {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--gap) * 0.5);
      }
      #wave {
        color: var(--stone);
        font-size: calc(var(--big) * 0.28);
      }
      #span {
        height: var(--big);
        display: grid;
        place-items: center;
      }
      #span > * {
        grid-area: 1 / 1;
      }
      #phase.prep #left,
      #phase.assault #prep {
        display: none;
      }
      #prep {
        width: calc(var(--big) * 2.4);
        height: calc(var(--big) * 0.16);
        background: var(--ground);
        padding: 2px;
        box-sizing: border-box;
      }
      #prep > i {
        display: block;
        height: 100%;
        width: calc(var(--drain) * 1%);
        background: var(--stone);
      }
      #left {
        color: var(--stone);
        font-size: var(--big);
      }
      /* Three or fewer left and the figure goes white and beats, at the
         slow rate of chapter 7 — the very one the columns of light of
         chapter 3 answer to. (spec 08-40, 03-38, 07 "Les signaux blancs") */
      #left.few {
        color: var(--white);
        animation: few 250ms ease-in-out infinite alternate;
      }
      @keyframes few {
        to {
          transform: scale(1.12);
        }
      }

      /* ================================================================
         The end of a game, and it is the one end there is: the town hall
         at nought. It is soft — the hud goes out in one second, a fade
         closes over the world in under three, and what it carries is the
         number of the wave reached and nothing else. A figure reads
         without knowing how to read, so there is no word of text, no red,
         no alarm and nothing tallied up. The Sas opens on it, and its one
         door is chapter 8's. (spec 01-28, 01-29, 01-30, 01-31, 08-63)

         It sits outside #hud because the hud is what erases: what stays
         is what the Sas will open on.
         ================================================================ */
      #hud.gone {
        animation: erasing 1s linear forwards;
      }
      @keyframes erasing {
        to {
          opacity: 0;
        }
      }
      #fade {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        /* It is looked at and never touched, exactly like the hud. */
        pointer-events: none;
        background: var(--ground);
        opacity: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        -webkit-user-select: none;
        user-select: none;
      }
      /* 2,4 s, under the three seconds the chapter bounds it by, and it
         holds where it stops: the world darkens behind it and stays there,
         which is the ground the Sas will sit on. (spec 01-29, 08-55) */
      #fade.on {
        animation: closing 2400ms ease-out forwards;
      }
      @keyframes closing {
        to {
          opacity: 0.94;
        }
      }
      #reached {
        color: var(--stone);
        font-size: clamp(64px, 24vmin, 200px);
      }

      /* ================================================================
         The Sas: the one screen there is when the game is not running —
         the welcome at load, the halt of an interruption, the halt one
         asks for, and the end of a game, all four at once. There is no
         second one, and it carries not one line of text and not one
         setting. (spec 08-52, 08-55, 08-60)

         Two doors: Reprendre, put forward by default, on a plain press;
         and Nouvelle partie, on a press held for a second while a ring
         fills clockwise — which empties in 200 ms if the press lets go.
         That held press is what replaces a written confirmation.
         (spec 08-56, 08-58)

         It sits last on the page, so it lies over the hud and over the
         fade that closes a game: the fade darkens the world, and the Sas
         opens on what it left. (spec 08-63)
         ================================================================ */
      #airlock {
        position: fixed;
        inset: 0;
        display: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #airlock.open {
        display: grid;
        place-items: center;
      }
      /* The game freezes and darkens behind it. The veil is derived — it
         is the hud's own ground, kept light enough that the city stays
         plainly visible under it, since the child has to see that his
         game is still there. (spec 08-55) */
      #airlock::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--ground);
        opacity: 0.66;
      }
      /* Two doors side by side, one door centred. The padding is the
         margin of a touch target, and it is the widest of the two of
         chapter 8. (spec 08-49, 08-57) */
      #doors {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: clamp(24px, 6vmin, 64px);
        padding: calc(env(safe-area-inset-top) + 32px) calc(env(safe-area-inset-right) + 32px)
          calc(env(safe-area-inset-bottom) + 32px) calc(env(safe-area-inset-left) + 32px);
      }
      #airlock.alone #resume {
        display: none;
      }
      .door {
        position: relative;
        width: clamp(132px, 28vmin, 260px);
        height: clamp(132px, 28vmin, 260px);
        display: grid;
        place-items: center;
        background: var(--ground);
        color: var(--stone);
        touch-action: none;
      }
      .door > * {
        grid-area: 1 / 1;
      }
      /* Reprendre is the one put forward by default. (spec 08-56) */
      #resume {
        box-shadow: inset 0 0 0 3px var(--stone);
      }
      .picto {
        width: 52%;
        height: 52%;
      }
      #resume .picto {
        transform: translateY(-24%);
      }
      #onwave {
        color: var(--stone);
        font-size: clamp(36px, 9vmin, 84px);
        transform: translateY(34%);
      }
      #fresh .glyph {
        width: 26%;
        height: 26%;
        fill: var(--stone);
        transform: translateY(88%);
      }
      /* The ring, which fills clockwise over the second the press is
         held and empties in 200 ms when it lets go — from wherever it
         had got to, which is what a transition does and an animation
         does not. The circle carries pathLength="100", so the two
         figures below are percentages of it and no geometry leaks into
         them. (spec 08-56) */
      #ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #ring circle {
        fill: none;
        stroke-width: 5;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }
      #ring .track {
        stroke: var(--lost);
      }
      #ring .fill {
        stroke: var(--white);
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        transition: stroke-dashoffset 200ms linear;
      }
      #fresh.held .fill {
        stroke-dashoffset: 0;
        transition-duration: 1000ms;
      }

      /* The little door that opens the Sas, top centre under the phase
         strip: a target and not a display, which is why it is the one
         thing in the hud that takes a press and why the top of the
         screen is where it goes — no thumb ever visits it, so no press
         can land on it by accident. It rides in the flow under the phase
         strip rather than at a measured height, so it stays under it in
         both dispositions. (spec 08-59)

         It is never under 44 px, and the phase strip alone puts it far
         further than 32 px from the top border. (spec 08-49) */
      #hatch {
        pointer-events: auto;
        width: clamp(44px, 7vmin, 64px);
        height: clamp(44px, 7vmin, 64px);
        margin-top: calc(var(--gap) * 0.5);
        display: grid;
        place-items: center;
        touch-action: none;
      }
      #hatch svg {
        width: 58%;
        height: 58%;
        fill: var(--stone);
        opacity: 0.55;
      }
      /* A game that has ended has no door to ask for: the hud erases, and
         the Sas is already opening. (spec 08-63) */
      #hud.gone #hatch {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud">
      <div id="strip">
        <!-- 1 — the bar of the town hall (spec 08-13 to 08-19) -->
        <div id="hall">
          <!-- The four stuffs of the picto, in the order a reinforcement
               walks them: wood, boards, stone, crenellations. It is the
               notch made legible, and never a figure. (spec 08-15) -->
          <div id="notch" class="n0">
            <svg viewBox="0 0 16 16">
              <rect x="1" y="4" width="14" height="11" fill="#6e4526" />
              <rect x="0" y="2" width="16" height="2" fill="#8a5a33" />
              <rect x="1" y="7" width="14" height="1" fill="#4d3019" />
              <rect x="1" y="11" width="14" height="1" fill="#4d3019" />
            </svg>
            <svg viewBox="0 0 16 16">
              <rect x="1" y="4" width="14" height="11" fill="#6e4526" />
              <rect x="0" y="2" width="16" height="2" fill="#8a5a33" />
              <rect x="1" y="7" width="14" height="1" fill="#4d3019" />
              <rect x="1" y="11" width="14" height="1" fill="#4d3019" />
              <rect x="2" y="5" width="12" height="2" fill="#8a5a33" transform="rotate(28 8 9)" />
              <rect x="2" y="11" width="12" height="2" fill="#8a5a33" transform="rotate(-28 8 9)" />
            </svg>
            <svg viewBox="0 0 16 16">
              <rect x="1" y="4" width="14" height="11" fill="#e8cba0" />
              <rect x="0" y="2" width="16" height="2" fill="#c9a87c" />
              <rect x="1" y="8" width="14" height="1" fill="#c9a87c" />
              <rect x="7" y="4" width="1" height="4" fill="#c9a87c" />
              <rect x="4" y="9" width="1" height="6" fill="#c9a87c" />
              <rect x="11" y="9" width="1" height="6" fill="#c9a87c" />
            </svg>
            <svg viewBox="0 0 16 16">
              <rect x="1" y="4" width="14" height="11" fill="#e8cba0" />
              <rect x="0" y="0" width="3" height="4" fill="#e8cba0" />
              <rect x="6" y="0" width="4" height="4" fill="#e8cba0" />
              <rect x="13" y="0" width="3" height="4" fill="#e8cba0" />
              <rect x="1" y="8" width="14" height="1" fill="#c9a87c" />
              <rect x="7" y="4" width="1" height="4" fill="#c9a87c" />
              <rect x="4" y="9" width="1" height="6" fill="#c9a87c" />
              <rect x="11" y="9" width="1" height="6" fill="#c9a87c" />
            </svg>
          </div>
          <div id="bar">
            <i class="seg" id="seg0"></i>
            <i class="seg" id="seg1"></i>
            <i class="seg" id="seg2"></i>
            <i class="seg" id="seg3"></i>
            <i class="seg" id="seg4"></i>
            <i class="seg" id="seg5"></i>
            <i class="seg" id="seg6"></i>
            <i class="seg" id="seg7"></i>
            <i class="seg" id="seg8"></i>
            <i class="seg" id="seg9"></i>
          </div>
        </div>

        <!-- 5 — the phase strip (spec 08-37 to 08-40) -->
        <div id="phase" class="assault">
          <b id="wave">1</b>
          <div id="span">
            <div id="prep"><i></i></div>
            <b id="left">0</b>
          </div>
          <!-- The little door of the Sas, and it is a target and not a
               sixth display: it rides here so it stays under the phase
               strip in both dispositions. (spec 08-59) -->
          <div id="hatch">
            <svg viewBox="0 0 16 16">
              <rect x="2" y="1" width="12" height="14" />
              <rect x="4" y="3" width="8" height="12" fill="#14110e" />
              <rect x="9" y="8" width="2" height="2" />
            </svg>
          </div>
        </div>

        <!-- 2 and 3 — the pips, and the purse under them (spec 08, "Les cinq affichages") -->
        <div id="mine">
          <div id="pips">
            <i class="pip" id="pip0"></i>
            <i class="pip" id="pip1"></i>
            <i class="pip" id="pip2"></i>
            <i class="pip" id="pip3"></i>
            <i class="pip" id="pip4"></i>
          </div>
          <div id="purse">
            <b id="coins">0</b>
            <div id="badges">
              <!-- The one fixed order of chapter 8: cannon, flame,
                   conveyor, reinforcement. The prices are written by
                   render/hud.ts off the balance, so no figure of the game
                   lives in this file. (spec 08-23, 08-26) -->
              <div class="badge" id="badge0">
                <svg viewBox="0 0 16 16">
                  <rect x="1" y="9" width="14" height="5" />
                  <rect x="3" y="4" width="10" height="5" />
                  <rect x="12" y="2" width="3" height="5" />
                </svg>
                <b id="price0"></b>
              </div>
              <div class="badge" id="badge1">
                <svg viewBox="0 0 16 16">
                  <rect x="1" y="10" width="14" height="4" />
                  <rect x="4" y="7" width="4" height="3" />
                  <rect x="8" y="5" width="3" height="3" />
                  <rect x="11" y="3" width="3" height="3" />
                </svg>
                <b id="price1"></b>
              </div>
              <div class="badge" id="badge2">
                <svg viewBox="0 0 16 16">
                  <rect x="1" y="6" width="14" height="4" />
                  <rect x="2" y="11" width="3" height="3" />
                  <rect x="7" y="11" width="3" height="3" />
                  <rect x="12" y="11" width="3" height="3" />
                </svg>
                <b id="price2"></b>
              </div>
              <div class="badge" id="badge3">
                <svg viewBox="0 0 16 16">
                  <rect x="1" y="5" width="14" height="9" />
                  <rect x="1" y="2" width="3" height="3" />
                  <rect x="7" y="2" width="3" height="3" />
                  <rect x="12" y="2" width="3" height="3" />
                </svg>
                <b id="price3"></b>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 4 — the street arrows (spec 08-31 to 08-36) -->
      <div id="arrows">
        <i class="arrow" id="arrow0"></i>
        <i class="arrow" id="arrow1"></i>
        <i class="arrow" id="arrow2"></i>
      </div>
    </div>

    <!-- The fade that closes a game, and the one figure it ever carries:
         the number of the wave reached. (spec 01-29, 01-30, 08-63) -->
    <div id="fade"><b id="reached"></b></div>

    <!-- The Sas, and it is the one screen there is when the game is not
         running. Not one word of text, not one setting. (spec 08-52,
         08-55, 08-60) -->
    <div id="airlock" class="shut">
      <div id="doors">
        <!-- Reprendre: the town hall, and the number of the wave in a
             large figure. A plain press. (spec 08-56) -->
        <div id="resume" class="door">
          <svg class="picto" viewBox="0 0 16 16">
            <rect x="2" y="6" width="12" height="9" fill="#b17c52" />
            <rect x="0" y="4" width="16" height="2" fill="#e8cba0" />
            <rect x="7" y="1" width="2" height="3" fill="#e8cba0" />
            <rect x="4" y="8" width="2" height="7" fill="#e8cba0" />
            <rect x="10" y="8" width="2" height="7" fill="#e8cba0" />
          </svg>
          <b id="onwave">1</b>
        </div>
        <!-- Nouvelle partie: the city — the star of three streets out of
             its square — and a circular arrow. Held for a second, while
             the ring fills. (spec 08-56) -->
        <div id="fresh" class="door">
          <svg id="ring" viewBox="0 0 100 100">
            <circle class="track" cx="50" cy="50" r="46" pathLength="100" />
            <circle class="fill" cx="50" cy="50" r="46" pathLength="100" />
          </svg>
          <svg class="picto" viewBox="0 0 16 16">
            <rect x="6" y="6" width="4" height="4" fill="#e8cba0" />
            <rect x="7" y="0" width="2" height="6" fill="#5fd8f2" />
            <rect x="4" y="9" width="2" height="2" fill="#f25fd8" />
            <rect x="2" y="11" width="2" height="2" fill="#f25fd8" />
            <rect x="0" y="13" width="2" height="2" fill="#f25fd8" />
            <rect x="10" y="9" width="2" height="2" fill="#e8f25f" />
            <rect x="12" y="11" width="2" height="2" fill="#e8f25f" />
            <rect x="14" y="13" width="2" height="2" fill="#e8f25f" />
          </svg>
          <svg class="glyph" viewBox="0 0 16 16">
            <circle
              cx="8"
              cy="8"
              r="6"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              pathLength="16"
              stroke-dasharray="12 4"
              transform="rotate(-40 8 8)"
            />
            <polygon points="9,0 16,4 9,8" />
          </svg>
        </div>
      </div>
    </div>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
